[project]
name = "rag_vu"
version = "0.2.0"
description = "Document ingestion and retrieval-augmented question answering"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "python-multipart==0.0.18",
    "uvicorn[standard]==0.34.2",
    "sqlalchemy==2.0.41",
    "alembic==1.15.2",
    "psycopg2-binary==2.9.10",
    "asyncpg==0.30.0",
    "pgvector==0.4.0",
    "pydantic==2.11.1",
    "pydantic-settings==2.14.0",
    "python-dotenv==1.1.0",
    "sqlalchemy-utils==0.41.2",
    "httpx>=0.28.1",
    "bs4>=0.0.2",
    "chainlit==2.6.3",
    "requests>=2.34.2",
    "sniffio>=1.3.1",
    "jinja2==3.1.6",
    "docling>=2.126.0",
    "celery[redis]>=5.4.0",
    "flower>=2.0.1",
    "fastmcp>=2.9.2",
    "skillsmd>=0.1.0",
    "arize-phoenix-otel>=0.17.3",
    "openinference-semantic-conventions>=0.1.47",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    # Serves the local cross-encoder reranker (reranker_service/, `reranker` compose service).
    # torch/transformers are already here via docling, so this adds little on top.
    "sentence-transformers>=5.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires PostgreSQL (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Autogenerated legacy migrations are kept byte-for-byte.
extend-exclude = [
    "alembic/versions/20261101_0001_single_active_pipeline.py",
    "alembic/versions/dab90acfb006_.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
