[project]
name = "rag_vu"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "python-multipart==0.0.18",
    "uvicorn[standard]==0.34.2",
    "sqlalchemy==2.0.41",
    "alembic==1.15.2",
    "psycopg2-binary==2.9.10",
    "asyncpg==0.30.0",
    "pgvector==0.4.0",
    "pydantic==2.11.1",
    "pydantic-settings==2.14.0",
    "python-dotenv==1.1.0",
    "sqlalchemy-utils==0.41.2",
    "httpx>=0.28.1",
    "bs4>=0.0.2",
    "chainlit>=2.0.0",
    "requests>=2.34.2",
    "sniffio>=1.3.1",
    "jinja2==3.1.6",
    "docling>=2.126.0",
    "celery[redis]>=5.4.0",
    "fastmcp>=2.9.2",
    "pydantic-ai>=0.4.3",
    "langgraph>=1.2.20",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.optional-dependencies]
dev = [
    "ruff==0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
