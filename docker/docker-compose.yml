x-app-image: &app-image
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: rag_vu-api
  env_file: ../.env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

# Redis is only the Celery job transport. Events live in PostgreSQL (outbox/inbox tables);
# a job message carries nothing but an inbox row id.
x-worker: &worker
  <<: *app-image
  environment:
    DATABASE_URL: ${DATABASE_URL}
    CELERY_BROKER_URL: redis://redis:6379/0
    OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
    HF_HOME: /hf-cache
    TRACING_ENABLED: ${TRACING_ENABLED:-true}
    PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006/v1/traces}
    PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-rag_vu}
  volumes:
    - ../app:/app/app
    - ../media:/app/media
    - rag_vu-hf-cache:/hf-cache
    - ../media/rapidocr-models:/usr/local/lib/python3.12/site-packages/rapidocr/models
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  deploy:
    resources:
      limits:
        cpus: "2.0"
  # Give an in-flight stage (parsing/embedding can run long) a real chance to finish and
  # ack cleanly on `docker compose stop`/`down` before Docker sends SIGKILL. A task that
  # still doesn't make it is not lost: the inbox row stays claimed in PostgreSQL and the
  # event-processor redelivers it, immediately on its own restart or after its lock
  # timeout, so the pipeline always resumes at the same stage either way.
  stop_grace_period: 120s

services:
  # AOF persistence (fsync at most once a second) plus an RDB snapshot on SIGTERM, so a
  # `docker compose down`/`up` cycle does not drop jobs that were already enqueued but not
  # yet claimed by a worker. This is a durability safety net, not the correctness mechanism:
  # pipeline state lives in PostgreSQL's outbox/inbox tables regardless (see celery_app.py),
  # and the event-processor reclaims anything left mid-stage on its own restart.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - rag_vu-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 30s

  postgres:
    build:
      context: ..
      dockerfile: docker/Dockerfile.postgres
    container_name: rag_vu-postgres
    env_file: ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PORT_PREFIX}432:5432"
    volumes:
      - rag_vu-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_textsearch

  api:
    <<: *app-image
    container_name: rag_vu-api
    ports:
      - "${PORT_PREFIX}080:8000"
    volumes:
      - ../app:/app/app
      - ../alembic:/app/alembic
      - ../alembic.ini:/app/alembic.ini
      - ../media:/app/media
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006/v1/traces}
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-rag_vu}
    depends_on:
      postgres:
        condition: service_healthy

  event-processor:
    <<: *app-image
    container_name: rag_vu-event-processor
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - ../app:/app/app
    command: ["python", "-m", "app.adapters.inbound.event_processor"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # On startup this reclaims any inbox message left mid-stage by the previous run (see
    # ReclaimOrphanedInboxMessages); on shutdown its loop iteration is a few short DB
    # round-trips, so it always exits well within this.
    stop_grace_period: 30s

  worker-upload:
    <<: *worker
    container_name: rag_vu-worker-upload
    command: ["celery", "-A", "app.adapters.inbound.celery_jobs.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "--queues=upload"]

  worker-parsing:
    <<: *worker
    container_name: rag_vu-worker-parsing
    command: ["celery", "-A", "app.adapters.inbound.celery_jobs.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "--queues=parsing"]

  worker-chunking:
    <<: *worker
    container_name: rag_vu-worker-chunking
    command: ["celery", "-A", "app.adapters.inbound.celery_jobs.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "--queues=chunking"]

  worker-embedding:
    <<: *worker
    container_name: rag_vu-worker-embedding
    command: ["celery", "-A", "app.adapters.inbound.celery_jobs.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "--queues=embedding,versioning"]

  query:
    <<: *app-image
    container_name: rag_vu-query
    environment:
      RAG_VU_API_BASE_URL: ${RAG_VU_API_BASE_URL:-http://localhost:${PORT_PREFIX}080}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      PYTHONPATH: /app
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006/v1/traces}
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-rag_vu}
    ports:
      - "${PORT_PREFIX}000:8000"
    volumes:
      - ../app:/app/app
    command: ["chainlit", "run", "app/adapters/inbound/chat_ui/chat.py", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  # Local cross-encoder reranker (Qwen3-Reranker-0.6B) served via
  # sentence-transformers' CrossEncoder, which has native support for this
  # model's causal-LM scoring scheme - see reranker_service/main.py for why
  # this exists instead of Ollama (no rerank endpoint; listwise LLM
  # prompting is the only option, see ollama_reranker.py) or
  # text-embeddings-inference (does not support this model's architecture).
  # CPU-only: this host's Radeon 780M iGPU has no usable ROCm support, so
  # there is no GPU path to offer here.
  #
  # Reuses the app image: torch/transformers are already in it via docling, and
  # sentence-transformers is locked in uv.lock with everything else. The model weights
  # are downloaded on first start into the shared HF cache volume and reused afterwards
  # (so the first start needs HF_HUB_OFFLINE=0).
  reranker:
    <<: *app-image
    container_name: rag_vu-reranker
    environment:
      HF_HOME: /hf-cache
      RERANKER_MODEL: ${RERANKER_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      RERANKER_MAX_LENGTH: ${RERANKER_MAX_LENGTH:-512}
      TRACING_ENABLED: "false"
    volumes:
      - ../reranker_service:/app/reranker_service
      - rag_vu-hf-cache:/hf-cache
    command: ["uvicorn", "reranker_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    deploy:
      resources:
        limits:
          cpus: "4.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      # Generous on purpose: the very first start also downloads the model weights.
      start_period: 300s
      retries: 5
    stop_grace_period: 30s

  # Arize Phoenix: trace UI at http://localhost:${PORT_PREFIX}006, OTLP/HTTP at /v1/traces.
  # Traces are stored in SQLite under the volume; delete the volume to start clean.
  #
  # Phoenix >= v22 enables auth by default for any Docker image bound to all interfaces
  # (PHOENIX_HOST=::), which otherwise makes span export from the api/worker containers
  # fail with 401 Unauthorized. This is a local, single-host dev stack with no external
  # exposure, so auth is explicitly disabled rather than provisioning and distributing an
  # API key — this keeps `docker compose up` fully self-configuring.
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: rag_vu-phoenix
    ports:
      - "${PORT_PREFIX}006:6006"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ENABLE_AUTH: "false"
    volumes:
      - rag_vu-phoenix-data:/mnt/data
    restart: unless-stopped

  # make test-unit / make test-integration
  tests:
    <<: *app-image
    profiles: ["test"]
    restart: "no"
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/rag_vu_test
      TRACING_ENABLED: "false"
    volumes:
      - ../app:/app/app
      - ../alembic:/app/alembic
      - ../alembic.ini:/app/alembic.ini
      - ../tests:/app/tests
      - ../pyproject.toml:/app/pyproject.toml
    command: ["pytest", "tests"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  rag_vu-pgdata:
  rag_vu-redis-data:
  rag_vu-hf-cache:
  rag_vu-phoenix-data:
